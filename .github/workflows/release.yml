name: Release

# Every push to main becomes an installable build: tag v<versionName>-<channel>.<commitCount>,
# one signed APK plus version.json + SHA256SUMS for the in-app updater.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — versionCode is the commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — refusing to publish unsigned APKs."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > brainstorm-upload.jks
          {
            echo "storeFile=brainstorm-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect, rename and checksum assets
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2)
          CHANNEL=$(grep -E '^channel=' version.properties | cut -d= -f2)
          CODE=$(git rev-list --count HEAD)
          TAG="v${VERSION}-${CHANNEL}.${CODE}"
          export VERSION CHANNEL CODE TAG
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Brain-Storm-${VERSION}_${CHANNEL}.apk"

          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, sys
          version = os.environ["VERSION"]; channel = os.environ["CHANNEL"]
          code = int(os.environ["CODE"]); tag = os.environ["TAG"]
          apk = pathlib.Path("dist") / f"Brain-Storm-{version}_{channel}.apk"
          entry = {
              "file": apk.name,
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "size": apk.stat().st_size,
          }
          payload = {
              "schema": 2,
              "versionCode": code,
              "versionName": version,
              "channel": channel,
              "tag": tag,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "package": "com.vegasol.brainstorm",
              "apk": entry,
              # 1.0.0 installs look up apks.<edition>. Keep these for one release so such an
              # install sees an explicit package mismatch instead of a false "up to date".
              "apks": {"consumer": entry, "managed": entry},
          }
          pathlib.Path("dist/version.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("dist/SHA256SUMS").write_text(f"{entry['sha256']}  {entry['file']}\n", encoding="utf-8")

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog, re.MULTILINE | re.DOTALL,
          )
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section for {version}; add one before releasing.")
          changes = match.group(1).strip()

          sha = os.environ.get("GITHUB_SHA", "")[:7]
          notes = f"""Automated build of `{sha}` (versionCode {code}).

          ## What changed

          {changes}

          ### Assets

          * `{apk.name}` - install this on any supported Android phone
          * `version.json` + `SHA256SUMS` - read by the in-app updater
          """
          pathlib.Path("notes.md").write_text(notes, encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          CODE: ${{ steps.meta.outputs.code }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; versionCode must increase with every push."
            exit 1
          fi
          PRERELEASE=""
          if [ "$CHANNEL" = "beta" ]; then PRERELEASE="--prerelease"; fi
          # Create the tag ourselves so it is annotated: `gh release create` alone
          # leaves a lightweight ref with no tagger, date or message. --verify-tag
          # below then refuses to publish unless this tag really exists.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Brain Storm ${VERSION} (${CHANNEL} ${CODE})" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --title "Brain Storm ${VERSION} (${CHANNEL} ${CODE})" \
            --notes-file notes.md \
            $PRERELEASE dist/*
