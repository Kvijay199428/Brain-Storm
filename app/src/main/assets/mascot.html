<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Storm – Meet Brainy</title>
<style>
:root{--bg1:#f4f0ff;--bg2:#d9cfff;--fg:#1d1540;--mut:#5b5380;--card:rgba(255,255,255,.72);--chip:rgba(124,92,255,.14);--acc:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1442;--bg2:#0a0620;--fg:#f2eeff;--mut:#a79fd0;--card:rgba(255,255,255,.09);--chip:rgba(157,123,255,.2);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1d1442;--bg2:#0a0620;--fg:#f2eeff;--mut:#a79fd0;--card:rgba(255,255,255,.09);--chip:rgba(157,123,255,.2);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg2);background-image:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 75%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px 0;text-align:center}
h1{margin:0;font-size:20px;letter-spacing:.3px}
header p{margin:2px 0 0;font-size:13px;color:var(--mut)}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bubble{position:absolute;top:8px;left:14px;right:14px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.35;pointer-events:none;text-align:center}
#tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--acc);margin-bottom:2px}
#msg{display:block}
#cd{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;margin-top:4px}
#ctl{padding:8px 14px 14px}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:9px 15px;background:var(--chip);color:var(--fg);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
label{display:block;font-size:13px;color:var(--mut)}
label b{color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0 0}
.glfb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1}
.glfb-t{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:var(--mut)}
header,#bubble,#ctl{display:none!important}html,body,#app,#stage{background:transparent!important;background-image:none!important}</style></head>
<body>
<div id="app">
<header><h1>Brain Storm</h1><p>Meet Brainy · drag to spin · tap to poke</p></header>
<div id="stage"><div id="bubble"><span id="tag"></span><span id="msg"></span><div id="cd" hidden></div></div></div>
<div id="ctl"><div id="chips"></div>
<label>Simulate reels watched today: <b id="rv">20</b> / 100<input type="range" id="sl" min="0" max="100" value="20"></label></div>
</div>
<script src="three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),stage=$('stage');
// Some WebViews (emulators, locked-down devices) have no WebGL context. Fail visibly instead of
// leaving a blank card, and let the host log the reason via console.
const HAS_GL=(()=>{try{const c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')))}catch(e){return false}})();
if(!HAS_GL){stage.innerHTML='<div class="glfb">🧠</div><div class="glfb-t">Brainy needs WebGL</div>';console.error('brainy: no webgl');throw new Error('brainy: no webgl')}
const R=new T.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));stage.appendChild(R.domElement);
const S=new T.Scene(),C=new T.PerspectiveCamera(35,1,.1,50);
S.add(new T.HemisphereLight(0xffffff,0x6a4cff,.95));
const dl=new T.DirectionalLight(0xffffff,.9);dl.position.set(3,4,5);S.add(dl);
const rim=new T.PointLight(0x9d7bff,.9);rim.position.set(-4,2,-3);S.add(rim);
const M=(c,r,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:r},o||{}));
const brainMat=M(0xff9ec4,.55),limbMat=M(0xf783ac,.6),dark=M(0x2a1a4a,.5,{side:T.DoubleSide}),white=M(0xffffff,.25),gold=M(0xffc83d,.3,{metalness:.6});
const root=new T.Group(),head=new T.Group();S.add(root);root.add(head);
function hemi(sx){const g=new T.SphereGeometry(1,72,56),p=g.attributes.position,v=new T.Vector3();
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=v.clone().normalize();
  const d=Math.sin(n.x*9+n.y*4)*Math.sin(n.y*11+n.z*5)*Math.sin(n.z*9-n.x*3);
  v.multiplyScalar(1+.07*d);v.x*=.95;v.y*=.85;v.z*=1.1;p.setXYZ(i,v.x,v.y,v.z)}
 g.computeVertexNormals();const m=new T.Mesh(g,brainMat);m.position.x=sx*.52;return m}
head.add(hemi(-1),hemi(1));
const eyes=[],brows=[];
[-1,1].forEach(sx=>{const e=new T.Group();e.position.set(sx*.4,.12,1.02);
 e.add(new T.Mesh(new T.SphereGeometry(.21,24,18),white));
 const pu=new T.Mesh(new T.SphereGeometry(.1,16,12),dark);pu.position.z=.17;e.add(pu);e.userData.pu=pu;head.add(e);eyes.push(e);
 const b=new T.Mesh(new T.BoxGeometry(.3,.06,.07),dark);b.position.set(sx*.4,.44,1.0);head.add(b);brows.push(b)});
const mouth=new T.Mesh(new T.TorusGeometry(.16,.03,10,28,Math.PI),dark);mouth.position.set(0,-.2,.95);mouth.rotation.z=Math.PI;head.add(mouth);
const stem=new T.Mesh(new T.CylinderGeometry(.2,.26,.45,16),M(0xe86d9a,.6));stem.position.set(0,-.95,-.1);root.add(stem);
[-1,1].forEach(sx=>{const l=new T.Mesh(new T.CylinderGeometry(.12,.12,.45,12),limbMat);l.position.set(sx*.4,-1.15,.2);root.add(l);
 const f=new T.Mesh(new T.SphereGeometry(.2,16,12),limbMat);f.scale.set(1,.5,1.4);f.position.set(sx*.4,-1.4,.3);root.add(f)});
const arms=[];
[-1,1].forEach(sx=>{const sh=new T.Group();sh.position.set(sx*1.1,-.6,.3);
 const a=new T.Mesh(new T.CylinderGeometry(.09,.09,.7,12),limbMat);a.position.y=-.35;
 const h=new T.Mesh(new T.SphereGeometry(.14,16,12),limbMat);h.position.y=-.72;
 const th=new T.Mesh(new T.SphereGeometry(.07,12,10),limbMat);th.scale.set(1,1.8,1);th.position.set(0,-.9,.04);th.visible=false;
 sh.add(a,h,th);sh.userData.th=th;root.add(sh);arms.push(sh)});
const lock=new T.Group();lock.add(new T.Mesh(new T.BoxGeometry(.55,.42,.22),gold));
const shk=new T.Mesh(new T.TorusGeometry(.17,.045,10,20,Math.PI),gold);shk.position.y=.21;lock.add(shk);lock.visible=false;root.add(lock);
const shadow=new T.Mesh(new T.CircleGeometry(1,32),new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.25}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=-1.5;shadow.scale.set(1.2,.7,1);S.add(shadow);
const conf=[],cols=[0xff9ec4,0xffd27a,0x7c5cff,0x7be0c3,0xffffff];
for(let i=0;i<50;i++){const m=new T.Mesh(new T.BoxGeometry(.09,.09,.02),new T.MeshBasicMaterial({color:cols[i%5]}));m.visible=false;m.userData.v=new T.Vector3();S.add(m);conf.push(m)}
function burst(){conf.forEach(m=>{m.visible=true;m.position.set(0,.3,.5);m.userData.v.set((Math.random()-.5)*5,Math.random()*5+2,(Math.random()-.2)*3)})}
const A=(x,z)=>({x,z});
const ST={
 idle:{n:'Idle',tag:'Friendly',c:0xff9ec4,mood:1,br:0,ra:A(0,.18),la:A(0,-.18),tilt:0,msg:'Hey! I’m Brainy. Your attention is safe with me.'},
 thinking:{n:'Thinking',tag:'Thinking',c:0xffd08a,mood:-.15,br:-.3,ra:A(-.8,.45),la:A(-1.15,-.85),tilt:-.18,msg:'Halfway there. What matters most today?'},
 permission:{n:'Permission',tag:'Setup needed',c:0xffb48a,mood:-.25,br:-.55,ra:A(-1.35,-.5),la:A(-1.35,.5),tilt:.2,msg:'I can’t see your apps yet. Please grant usage access.'},
 welcome:{n:'Welcome',tag:'Happy',c:0xff9ec4,mood:1.3,br:-.1,ra:A(0,2.5),la:A(0,-.18),tilt:.08,msg:'Welcome back! Ready for a focused day?'},
 warning:{n:'Warning',tag:'Concerned · 80% used',c:0xffb48a,mood:-.35,br:-.4,ra:A(0,.3),la:A(0,-.3),tilt:.3,msg:'Hmm… you’re close to your limit. Maybe wrap it up soon?'},
 limit:{n:'Limit',tag:'Strict',c:0xff6f7d,mood:-1,br:.55,ra:A(-1.25,-1.1),la:A(-1.25,1.1),tilt:0,msg:'Hey! Enough scrolling! You hit your daily limit.'},
 lockout:{n:'Lockout',tag:'Locked for 24 hours',c:0xb78cff,mood:.1,br:.25,ra:A(-1.1,-1),la:A(-1.1,1),tilt:-.06,lock:1,down:1,msg:'Your apps unlock in:'},
 unlock:{n:'Unlock',tag:'Excited',c:0xffc38a,mood:1.5,br:-.2,ra:A(0,2.6),la:A(0,-2.6),tilt:0,jump:1,burst:1,msg:'You’re free! Use the time wisely.'},
 success:{n:'Success',tag:'Proud',c:0xff9ec4,mood:1.3,br:-.15,ra:A(0,2.3),la:A(0,-.18),tilt:.1,thumb:1,burst:1,msg:'Great discipline today. Your future self thanks you!'}
};
let cur='idle',tc=new T.Color(ST.idle.c),lockEnd=0,lt,pt;
const chips=$('chips');
Object.keys(ST).forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=ST[k].n;b.dataset.k=k;b.onclick=()=>{clearTimeout(lt);setState(k)};chips.appendChild(b)});
function setState(k,msg){const s=ST[k]||ST.idle;cur=ST[k]?k:'idle';tc.set(s.c);$('tag').textContent=s.tag;$('msg').textContent=msg||s.msg;
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===cur));
 lock.visible=!!s.lock;arms[1].userData.th.visible=!!s.thumb;$('cd').hidden=!s.lock;
 if(s.lock)lockEnd=Date.now()+864e5;if(s.burst)burst()}
setInterval(()=>{if(cur!=='lockout')return;let r=Math.max(0,lockEnd-Date.now())/1000|0;
 $('cd').textContent=[r/3600|0,(r/60|0)%60,r%60].map(n=>String(n).padStart(2,'0')).join(':')},250);
const sl=$('sl');sl.oninput=()=>{const v=+sl.value;$('rv').textContent=v;clearTimeout(lt);
 if(v>=100){setState('limit');lt=setTimeout(()=>setState('lockout'),1800)}
 else if(v>=80)setState('warning',`${v} reels watched. Only ${100-v} left today!`);
 else setState('idle',v<40?ST.idle.msg:`${v} reels so far. Doing fine, keep it mindful.`)};
const look={x:0,y:0},tl={x:0,y:0};
addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();tl.x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2)));tl.y=Math.max(-1,Math.min(1,-(e.clientY-r.top-r.height/2)/(r.height/2)))});
let yaw=0,yawV=0,drag=false,lastDrag=0,sq=0,pokes=0,pokeT=0,down=null;
const cv=R.domElement,ray=new T.Raycaster(),pv=new T.Vector2();
cv.addEventListener('pointerdown',e=>{drag=true;down={x:e.clientX,y:e.clientY,t:performance.now(),m:0};cv.setPointerCapture(e.pointerId);yawV=0});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-down.x;down.m+=Math.abs(dx)+Math.abs(e.clientY-down.y);down.x=e.clientX;down.y=e.clientY;yaw+=dx*.012;yawV=dx*.012;lastDrag=performance.now()});
cv.addEventListener('pointerup',e=>{drag=false;if(down.m<8&&performance.now()-down.t<400)tap(e)});
const Q=['Boop! That tickles!','Careful, that’s my frontal lobe!','Neurons firing!','Want to read a book instead?','Hello, human!','Ouch! I’m thinking here.'];
function tap(e){const r=cv.getBoundingClientRect();pv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pv,C);
 if(!ray.intersectObject(root,true).length)return;sq=1;const now=performance.now();pokes=now-pokeT<1500?pokes+1:1;pokeT=now;
 if(pokes>=5){pokes=0;clearTimeout(pt);setState('limit','OK, that’s enough poking! Go read something great.');pt=setTimeout(()=>setState('idle'),3000)}
 else if(cur==='idle'||cur==='welcome'||cur==='success')$('msg').textContent=Q[Math.random()*Q.length|0]}
// A WebView that is resized after the first layout keeps a stale (0-height) initial containing
// block, so 100%/100vh resolve to zero. Drive the stage from the live viewport instead.
function syncSize(){const h=(window.innerHeight||document.documentElement.clientHeight||0);
 if(h>0){$('app').style.height=h+'px';document.body.style.height=h+'px'}}
function fit(){syncSize();const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);C.aspect=w/Math.max(h,1);
 C.position.set(0,.2,Math.max(7.4,Math.max(3.9/(C.aspect*.63),4.6/.63*.0+7.4)));C.lookAt(0,-.1,0);C.updateProjectionMatrix()}
let fitTries=0;
function fitLoop(){fit();if((stage.clientHeight<8||stage.clientWidth<8)&&fitTries++<90)requestAnimationFrame(fitLoop)}
new ResizeObserver(fit).observe(stage);
window.addEventListener('resize',()=>{fitTries=0;fitLoop()});
fitLoop();
let t=0,last=performance.now(),nb=2,bl=0,raf=0,paused=false;
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;const k=1-Math.exp(-dt*8),s=ST[cur];
 brainMat.color.lerp(tc,k);mouth.scale.y+=(s.mood-mouth.scale.y)*k;
 brows[0].rotation.z+=(-s.br-brows[0].rotation.z)*k;brows[1].rotation.z+=(s.br-brows[1].rotation.z)*k;
 if(!drag){if(Math.abs(yawV)>.0005){yaw+=yawV;yawV*=.94}else if(now-lastDrag>1800)yaw+=(Math.round(yaw/(Math.PI*2))*Math.PI*2-yaw)*Math.min(1,dt*2.5)}
 root.rotation.y=yaw;
 look.x+=((s.down?0:tl.x)-look.x)*k;look.y+=((s.down?-1.2:tl.y)-look.y)*k;
 eyes.forEach(e=>e.userData.pu.position.set(look.x*.08,look.y*.08,.17));
 nb-=dt;if(nb<0){bl=1;nb=2+Math.random()*3}bl=Math.max(0,bl-dt*7);eyes.forEach(e=>e.scale.y=1-Math.sin(bl*Math.PI)*.9);
 head.rotation.z+=((s.tilt+Math.sin(t*1.2)*.03)-head.rotation.z)*k;
 head.rotation.x+=(-look.y*.12-head.rotation.x)*k;
 const br=1+Math.sin(t*2)*.015;sq*=Math.exp(-dt*5);
 root.scale.set(br*(1+.14*sq),br*(1-.22*sq),br*(1+.14*sq));
 root.position.y=s.jump?Math.abs(Math.sin(t*6))*.5:Math.sin(t*2)*.05;
 shadow.scale.set(1.2-root.position.y*.5,.7-root.position.y*.3,1);
 arms.forEach((a,i)=>{const p=i?s.ra:s.la;let z=p.z;if(cur==='welcome'&&i)z+=Math.sin(t*9)*.35;if(cur==='warning')z+=Math.sin(t*14+i)*.04;
  a.rotation.x+=(p.x-a.rotation.x)*k;a.rotation.z+=(z-a.rotation.z)*k});
 if(s.lock){lock.position.y=1.55+Math.sin(t*3)*.06;lock.rotation.y=t}
 conf.forEach(m=>{if(!m.visible)return;const v=m.userData.v;v.y-=9*dt;m.position.addScaledVector(v,dt);m.rotation.x+=dt*6;m.rotation.y+=dt*4;if(m.position.y<-2.5)m.visible=false});
 R.render(S,C)}
setState('welcome');setTimeout(()=>{if(cur==='welcome')setState('idle')},3500);
function loop(now){raf=requestAnimationFrame(loop);frame(now)}
window.brainyPause=()=>{if(paused)return;paused=true;if(raf){cancelAnimationFrame(raf);raf=0}};
window.brainyResume=()=>{if(!paused)return;paused=false;last=performance.now();raf=requestAnimationFrame(loop)};
raf=requestAnimationFrame(loop);
</script></body></html>
